alerts:
  - name: high_request_latency
    severity: warning
    condition: 'p95(response_sent.latency_ms) > 3000'
    duration: 5m
    type: symptom-based
    channel: 'slack:#llmops-alerts'
    owner: llm-platform-oncall
    runbook: docs/alerts.md#high-request-latency
  - name: elevated_request_error_rate
    severity: critical
    condition: 'count(request_failed) / count(request_received) * 100 > 2'
    duration: 5m
    type: symptom-based
    channel: 'slack:#llmops-alerts'
    owner: llm-platform-oncall
    runbook: docs/alerts.md#elevated-request-error-rate
  - name: degraded_answer_quality
    severity: warning
    condition: 'avg(response_sent.quality_score) < 0.75'
    duration: 15m
    type: symptom-based
    channel: 'slack:#llmops-alerts'
    owner: ai-quality-oncall
    runbook: docs/alerts.md#degraded-answer-quality
